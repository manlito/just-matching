# The Python package, as just-ba's. pip and the wheel builds use scikit-build-core, which runs the CMake build
# with the options below. The CUDA packages (just-matching-cu12, just-matching-cu13) are built from this file
# after packaging/variant.py has rewritten their name and CMake options. No weights are in any package
# (JMT_EMBED_WEIGHTS stays off): users give a checkpoint at run time (bindings/python/README.md).

[build-system]
requires = ["scikit-build-core>=0.11", "nanobind==3.1.0", "numpy>=1.26"]  # numpy: the stub generation imports the module
build-backend = "scikit_build_core.build"

[project]
name = "just-matching"
dynamic = ["version"]
description = "FlexGlue and LightGlue image matching with minimal dependencies: CPU, Metal and CUDA backends"
readme = "bindings/python/README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26"]
keywords = ["feature matching", "LightGlue", "FlexGlue", "structure from motion", "photogrammetry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.urls]
Source = "https://github.com/manlito/just-matching"

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.24"
build-dir = "build/wheel/{wheel_tag}"
# One wheel per platform for every Python from 3.12 (stable ABI, as just-ba).
wheel.py-api = "cp312"
wheel.packages = ["bindings/python/just_matching"]
sdist.exclude = ["CLAUDE.md", "docs", "third_party", "build", "weights/*.jmtw", "wheelhouse", "dist", ".github",
                 ".claude", ".venv", "bindings/python/.venv", "web/samples"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(just_matching VERSION (?P<value>[0-9.]+)'

[tool.scikit-build.cmake.define]
JMT_BUILD_PYTHON = "ON"
JMT_BUILD_TESTS = "OFF"
JMT_BUILD_CLI = "OFF"
JMT_BUILD_WASM = "OFF"
JMT_EMBED_WEIGHTS = "OFF"
JMT_WEBGPU = "OFF"
JMT_CUDA = "OFF"
JMT_PACKAGE_VARIANT = "cpu"

# Wheels: built by .github/workflows/release.yml on every push to main. One abi3 wheel per platform, tested with
# the Python tests (without weights, the API and its errors). The CUDA packages add their settings in the
# workflow (CIBW_* variables).
[tool.cibuildwheel]
build = "cp312-*"
skip = ["*-musllinux_*", "*-win32", "*_i686"]
build-verbosity = 1
test-requires = ["pytest"]
test-command = "pytest -q {project}/bindings/python/tests"

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["arm64"]
# The Metal backend compiles its kernels at run time; the fast ones need macOS 26 and are chosen then.
environment = { MACOSX_DEPLOYMENT_TARGET = "13.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
