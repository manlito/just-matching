# The documentation site with the live demo (docs/README.md). Started by hand only, like just-keypoints':
#
#   gh workflow run docs                    # build the modules and the site
#   gh workflow run docs -f deploy=true     # the same, then publish to Cloudflare Pages
#
# Free hosted runner. Needs the repository secret JKP_REPO_TOKEN, a token that can read just-keypoints (its
# module gives the demo its keypoints). Deploying also needs CLOUDFLARE_API_TOKEN (permission
# "Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID, and a Pages project made for direct upload, named by the
# repository variable CLOUDFLARE_PAGES_PROJECT (default "just-matching"). FlexGlue's weights are not built or
# deployed: users load their own copy into the demo (docs/README.md).
name: docs

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish to Cloudflare Pages"
        type: boolean
        default: false

concurrency:
  group: docs
  cancel-in-progress: true

permissions:
  contents: read

env:
  EMSCRIPTEN_VERSION: "7.0.0"

jobs:
  docs:
    name: build (and deploy) the site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: manlito/just-keypoints
          token: ${{ secrets.JKP_REPO_TOKEN }}
          path: third_party/just-keypoints
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r docs/requirements.txt ninja
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"
      # Both libraries use the same Dawn release.
      - name: Fetch emdawnwebgpu
        run: tools/fetch_webgpu.sh browser

      - name: Build just-keypoints' module
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S third_party/just-keypoints -B build/jkp-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DJKP_EMBED_WEIGHTS=OFF -DJKP_BUILD_CLI=OFF -DJKP_BUILD_TESTS=OFF -DJKP_WEBGPU=ON \
            -DJKP_EMDAWNWEBGPU_DIR="$PWD/third_party/webgpu/emdawnwebgpu/emdawnwebgpu_pkg"
          cmake --build build/jkp-wasm
      - name: Build the WebAssembly module
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build/wasm -G Ninja -DCMAKE_BUILD_TYPE=Release -DJMT_BUILD_CLI=OFF \
            -DJMT_BUILD_TESTS=OFF -DJMT_WEBGPU=ON -DJMT_JKP_WEB_DIR="$PWD/build/jkp-wasm/web"
          cmake --build build/wasm
      - name: Build the site (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html
      - name: Deploy to Cloudflare Pages
        if: inputs.deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.162.0 pages deploy docs/_build/html
          --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT || 'just-matching' }}" --branch main
